<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Atendimento</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="main-container">
        <div class="side-panel">
            
            <div class="qr-code-area">
                <h2>Escaneie para gerar sua senha</h2>
                <img src="qrcode.png" alt="QR Code para gerar senha" style="width: 20vw; max-width: 300px;">
            </div>

            <div class="buttons-container">
                <button id="btn-gerar-senha">Gerar Senha</button>
                <button id="btn-chamar-senha">Chamar Senha</button>
            </div>
            
            <div class="painel-col side-panel-list">
                <h2>Próximas Senhas</h2>
                <ul id="lista-senhas-criadas"></ul>
            </div>
        </div>

        <div class="youtube-area">
            <iframe width="100%" height="100%" src="https://www.youtube.com/embed/QafaX9-4bDc?si=kbcRaGV8c4A8-Nrt&amp;controls=0" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>
        </div>
        
        <div class="painel-row">
            <div class="painel-col">
                <h2>Senha Chamada</h2>
                <div id="senha-chamada"></div>
            </div>
            <div class="painel-col">
                <h2>Senhas Atendidas</h2>
                <ul id="lista-senhas-chamadas"></ul>
            </div>
        </div>
        
    </div>
    <script src="painel.js"></script>
</body>
</html>
